name: Moteur Le Pacte
on: [push, pull_request]
permissions:
  contents: read
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check public/animation.js
      - run: node --check public/studio.js
      - run: node --check public/app.js
      - run: node --check server/start.mjs
      - run: npm test
      - run: npm run demo
